<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sonoscope — frequency analyser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <a class="skip-link" href="#scope">Skip to analyser</a>

    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>
          <strong>Sonoscope</strong>
          <small>Spectrum</small>
        </span>
      </div>
      <div class="masthead-controls" role="toolbar" aria-label="Input">
        <span class="environment" id="live-state">
          <i id="live-led"></i>
          <span id="live-label">Standby</span>
        </span>
        <button class="button button-dark" id="btn-mic" type="button">Listen</button>
        <button class="button button-outline" id="btn-tab" type="button">Tab</button>
        <button class="button button-outline" id="btn-file" type="button">File</button>
        <button class="button button-signal" id="btn-tone" type="button">440</button>
        <button class="button button-outline" id="btn-stop" type="button" disabled>Stop</button>
        <input id="file-input" type="file" accept="audio/*" hidden />
      </div>
    </header>

    <div class="status-strip" aria-live="polite">
      <span id="status-input">Input idle</span>
      <span id="status-rate">— Hz</span>
      <span id="status-fft">FFT —</span>
      <span id="status-df">Δf —</span>
    </div>

    <p class="honesty" id="notice" hidden></p>

    <main class="console">
      <section class="instrument" id="scope">
        <div class="scope-chrome">
          <span class="scope-title">Spectrum</span>
          <span class="scope-meta">20 Hz–20 kHz · log · dBFS</span>
        </div>
        <div class="scope-frame">
          <canvas id="canvas" width="1200" height="520" aria-label="Frequency spectrum"></canvas>
        </div>
      </section>

      <section class="metric-grid" aria-label="Readouts">
        <article>
          <span>Peak</span>
          <strong id="readout-peak">—</strong>
          <small id="readout-peak-db">awaiting</small>
        </article>
        <article>
          <span>Note</span>
          <strong id="readout-note">—</strong>
          <small id="readout-cents">A4=440</small>
        </article>
        <article>
          <span>Centroid</span>
          <strong id="readout-centroid">—</strong>
          <small>brightness</small>
        </article>
        <article>
          <span>RMS</span>
          <strong id="readout-rms">—</strong>
          <small>level</small>
        </article>
      </section>

      <section class="controls-panel" aria-label="Measurement">
        <div class="controls">
          <label>
            <span>FFT</span>
            <select id="fft-size">
              <option value="2048">2048</option>
              <option value="4096" selected>4096</option>
              <option value="8192">8192</option>
              <option value="16384">16384</option>
            </select>
          </label>
          <label>
            <span>Smooth <em id="smoothing-val">0.72</em></span>
            <input id="smoothing" type="range" min="0" max="0.95" step="0.01" value="0.72" />
          </label>
          <label>
            <span>Gain <em id="gain-val">1.00</em></span>
            <input id="gain" type="range" min="0.25" max="8" step="0.05" value="1" />
          </label>
          <label class="check">
            <input id="peak-hold" type="checkbox" checked />
            <span>Hold</span>
          </label>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
